<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QR Fayl Transfer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#007AFF;--ok:#34C759;--err:#FF3B30;--bg:#F2F2F7;--card:#fff;--t:#000;--t2:#8E8E93;--br:#E5E5EA}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--t:#fff;--br:#38383A}}
body{font-family:-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--t);padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--br);position:sticky;top:0;z-index:5}
.tab{flex:1;padding:14px;border:0;background:none;color:var(--t2);font-size:16px;font-weight:600;border-bottom:3px solid transparent}
.tab.on{color:var(--p);border-bottom-color:var(--p)}
.page{display:none;padding:16px;max-width:520px;margin:auto}
.page.on{display:block}
.card{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:16px;margin-bottom:14px;text-align:center}
.pick{border:2px dashed var(--br);cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--p);color:#fff;font-size:16px;font-weight:600;margin-top:10px}
.btn.g{background:var(--t2)}
.btn:disabled{opacity:.5}
.file{display:flex;justify-content:space-between;gap:8px;text-align:left;padding:8px 0;border-bottom:1px solid var(--br);font-size:14px;align-items:center}
.file small{color:var(--t2);display:block}
.file b{word-break:break-all}
.dl{background:var(--ok);color:#fff;border:0;border-radius:8px;padding:8px 12px}
video{width:100%;max-width:240px;border-radius:10px;background:#000;display:none;margin:10px auto 0}
.qr{display:inline-block;background:#fff;padding:12px;border-radius:8px;margin:10px 0}
.hint{color:var(--t2);font-size:13px;margin-top:6px}
.bar{height:8px;background:var(--br);border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
#toast{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px;border-radius:10px;color:#fff;display:none;z-index:9;text-align:center}
</style>
</head>
<body>
<div class="tabs">
  <button class="tab on" id="tabS" onclick="tab('s')">📤 Yuborish</button>
  <button class="tab" id="tabR" onclick="tab('r')">📥 Qabul</button>
</div>

<div class="page on" id="pS">
  <div class="card pick" id="pickBox" onclick="$('fi').click()">
    <h3>📁 Fayl tanlang</h3><p class="hint">Bosing (jami 4 GB gacha)</p>
    <input type="file" id="fi" multiple hidden onchange="pickFiles(this.files)">
  </div>
  <div class="card" id="sInfo" style="display:none">
    <div id="sList"></div>
    <button class="btn" id="sendBtn" onclick="sendStart()">Yuborish</button>
  </div>
  <div class="card" id="sQRc" style="display:none">
    <b id="sStep">1-qadam</b>
    <div><div class="qr" id="sQR"></div></div>
    <video id="vidS" playsinline muted></video>
    <div class="bar"><i id="sBar"></i></div>
    <div class="hint" id="sTxt"></div>
  </div>
  <button class="btn g" onclick="location.reload()">Bekor qilish / Qayta boshlash</button>
</div>

<div class="page" id="pR">
  <div class="card">
    <b id="rStep">1-qadam: yuboruvchining QR kodini skanerlang</b>
    <div><video id="vidR" playsinline muted></video></div>
    <div><div class="qr" id="rQR" style="display:none"></div></div>
    <div class="bar"><i id="rBar"></i></div>
    <div class="hint" id="rTxt"></div>
  </div>
  <div class="card" id="rFiles" style="display:none"><b>Qabul qilingan fayllar</b><div id="rList"></div></div>
  <button class="btn g" onclick="location.reload()">Bekor qilish / Qayta boshlash</button>
</div>
<div id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const CHUNK=64*1024, MAX=4*1024**3;
let pc,dc,files=[],scanStream=null,scanning=false;

function toast(m,c){const t=$('toast');t.textContent=m;t.style.background=c||'var(--err)';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4000)}
function fmt(b){const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function tab(t){
  $('tabS').classList.toggle('on',t==='s');$('tabR').classList.toggle('on',t==='r');
  $('pS').classList.toggle('on',t==='s');$('pR').classList.toggle('on',t==='r');
  if(t==='r'&&!pc)startScan($('vidR'),onOffer);
  else if(!pc)stopScan();
}

/* ---------- QR skaner ---------- */
async function startScan(v,cb){
  stopScan();
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}
  catch(e){toast('Kamera ochilmadi: '+e.name);return}
  v.srcObject=scanStream;v.muted=true;
  try{await v.play()}catch(e){}
  v.style.display='block';scanning=true;
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  (function tick(){
    if(!scanning)return;
    if(v.readyState>=2&&v.videoWidth){
      cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
      const im=cx.getImageData(0,0,cv.width,cv.height),c=jsQR(im.data,im.width,im.height);
      if(c&&c.data){scanning=false;cb(c.data);return}
    }
    requestAnimationFrame(tick);
  })();
}
function stopScan(){
  scanning=false;
  if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}
  document.querySelectorAll('video').forEach(v=>{v.style.display='none';v.srcObject=null});
}

/* ---------- SDP ni kichik QR ma'lumotiga siqish ---------- */
function pack(sdp,type){
  const g=r=>(sdp.match(r)||[])[1]||'';
  const c=[...sdp.matchAll(/a=candidate:\S+ 1 udp \d+ (\d+\.\d+\.\d+\.\d+) (\d+) typ host/g)].map(m=>m[1]+':'+m[2]);
  return {t:type,u:g(/a=ice-ufrag:(\S+)/),p:g(/a=ice-pwd:(\S+)/),f:g(/a=fingerprint:sha-256 (\S+)/).replace(/:/g,''),c};
}
function unpack(text){
  const d=JSON.parse(text);
  if(!d.u||!d.p||!d.f||!d.c||!d.c.length)throw new Error('bad');
  const cands=d.c.map((a,i)=>{const [ip,port]=a.split(':');return `a=candidate:${i+1} 1 udp ${2113937151-i} ${ip} ${port} typ host`});
  const sdp=['v=0','o=- 1 2 IN IP4 127.0.0.1','s=-','t=0 0','a=group:BUNDLE 0','a=msid-semantic: WMS',
    'm=application 9 UDP/DTLS/SCTP webrtc-datachannel','c=IN IP4 0.0.0.0',
    'a=ice-ufrag:'+d.u,'a=ice-pwd:'+d.p,'a=fingerprint:sha-256 '+d.f.match(/../g).join(':'),
    'a=setup:'+(d.t==='o'?'actpass':'active'),'a=mid:0','a=sctp-port:5000','a=max-message-size:262144',
    ...cands,'a=end-of-candidates'].join('\r\n')+'\r\n';
  return {type:d.t==='o'?'offer':'answer',sdp};
}
function showQR(el,obj){
  const box=$(el);box.style.display='inline-block';box.innerHTML='';
  new QRCode(box,{text:JSON.stringify(obj),width:240,height:240,correctLevel:QRCode.CorrectLevel.L});
}
function gathered(p){
  return new Promise(res=>{
    if(p.iceGatheringState==='complete')return res();
    const t=setTimeout(res,2500);
    p.onicegatheringstatechange=()=>{if(p.iceGatheringState==='complete'){clearTimeout(t);res()}};
  });
}
function newPC(){
  const p=new RTCPeerConnection({iceServers:[]});
  p.onconnectionstatechange=()=>{if(p.connectionState==='failed')toast('Ulanish bajarilmadi. Ikkala telefon bir Wi-Fi/hotspotda ekanini tekshiring')};
  return p;
}

/* ---------- YUBORUVCHI ---------- */
function pickFiles(list){
  const arr=[...list];
  if(arr.reduce((s,f)=>s+f.size,0)>MAX){toast('Jami hajm 4 GB dan oshmasin');return}
  files=arr;
  $('sList').innerHTML=files.map(f=>`<div class="file"><div><b>${esc(f.name)}</b><small>${fmt(f.size)}</small></div></div>`).join('');
  $('sInfo').style.display=files.length?'block':'none';
}
async function sendStart(){
  if(!files.length)return;
  $('sendBtn').disabled=true;$('pickBox').style.display='none';
  // kamera ruxsati bo'lsa Chrome haqiqiy IP manzillarni beradi
  let tmp=null;try{tmp=await navigator.mediaDevices.getUserMedia({video:true})}catch(e){}
  pc=newPC();
  dc=pc.createDataChannel('f',{ordered:true});dc.binaryType='arraybuffer';dc.bufferedAmountLowThreshold=1<<20;
  dc.onopen=sendFiles;
  await pc.setLocalDescription(await pc.createOffer());
  await gathered(pc);
  if(tmp)tmp.getTracks().forEach(t=>t.stop());
  const o=pack(pc.localDescription.sdp,'o');
  if(!o.c.length){toast('IP manzil topilmadi. Wi-Fi yoki hotspotga ulaning va kamera ruxsatini bering');return}
  $('sQRc').style.display='block';
  showQR('sQR',o);
  $('sStep').textContent='1-qadam: bu QR ni qabul qiluvchi telefonga skanerlating';
  $('sTxt').textContent='Qabul qiluvchi javob QR kodini ko‘rsatgach, kamera avtomatik ochiladi';
  setTimeout(()=>{
    $('sStep').textContent='2-qadam: qabul qiluvchining javob QR kodini skanerlang';
    startScan($('vidS'),async t=>{
      try{
        await pc.setRemoteDescription(unpack(t));
        stopScan();$('sQR').style.display='none';
        $('sStep').textContent='Ulanmoqda...';
      }catch(e){toast('QR noto‘g‘ri, qayta urinib ko‘ring');startScan($('vidS'),arguments.callee)}
    });
  },1500);
}
async function sendFiles(){
  stopScan();$('sQR').style.display='none';
  $('sStep').textContent='Yuborilmoqda...';
  const total=files.reduce((s,f)=>s+f.size,0);let sent=0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    dc.send(JSON.stringify({m:'meta',n:f.name,s:f.size,i,c:files.length}));
    for(let o=0;o<f.size;o+=CHUNK){
      if(dc.bufferedAmount>4<<20)await new Promise(r=>dc.addEventListener('bufferedamountlow',r,{once:true}));
      const buf=await f.slice(o,o+CHUNK).arrayBuffer();
      dc.send(buf);sent+=buf.byteLength;
      $('sBar').style.width=(sent/total*100)+'%';
      $('sTxt').textContent=`${i+1}/${files.length} · ${fmt(sent)} / ${fmt(total)}`;
    }
    dc.send(JSON.stringify({m:'end'}));
  }
  dc.send(JSON.stringify({m:'all'}));
  $('sStep').textContent='✅ Yuborish tugadi';
  toast('Yuborish tugadi','var(--ok)');
}

/* ---------- QABUL QILUVCHI ---------- */
async function onOffer(text){
  try{
    const desc=unpack(text);
    $('rStep').textContent='Ulanmoqda...';
    pc=newPC();
    pc.ondatachannel=e=>{
      dc=e.channel;dc.binaryType='arraybuffer';
      dc.onopen=()=>{$('rQR').style.display='none';$('rStep').textContent='Qabul qilinmoqda...'};
      let cur=null,parts=[],got=0;
      dc.onmessage=ev=>{
        if(typeof ev.data==='string'){
          const m=JSON.parse(ev.data);
          if(m.m==='meta'){cur=m;parts=[];got=0;$('rBar').style.width='0'}
          else if(m.m==='end'){addFile(cur.n,new Blob(parts));parts=[]}
          else if(m.m==='all'){$('rStep').textContent='✅ Qabul qilish tugadi';toast('Barcha fayllar qabul qilindi','var(--ok)')}
        }else{
          parts.push(ev.data);got+=ev.data.byteLength;
          $('rBar').style.width=(got/cur.s*100)+'%';
          $('rTxt').textContent=`${cur.i+1}/${cur.c} · ${cur.n} · ${fmt(got)} / ${fmt(cur.s)}`;
        }
      };
    };
    await pc.setRemoteDescription(desc);
    await pc.setLocalDescription(await pc.createAnswer());
    await gathered(pc);
    stopScan();
    const a=pack(pc.localDescription.sdp,'a');
    if(!a.c.length){toast('IP manzil topilmadi. Wi-Fi yoki hotspotga ulaning');return}
    showQR('rQR',a);
    $('rStep').textContent='2-qadam: bu QR ni yuboruvchi telefonga skanerlating';
  }catch(e){
    console.error(e);pc=null;
    toast('QR noto‘g‘ri, qayta urinib ko‘ring');
    startScan($('vidR'),onOffer);
  }
}
function addFile(name,blob){
  $('rFiles').style.display='block';
  const url=URL.createObjectURL(blob);
  const d=document.createElement('div');d.className='file';
  d.innerHTML=`<div><b>${esc(name)}</b><small>${fmt(blob.size)}</small></div>`;
  const b=document.createElement('button');b.className='dl';b.textContent='⬇️ Saqlash';
  b.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
  d.appendChild(b);$('rList').appendChild(d);
}
</script>
</body>
</html>
